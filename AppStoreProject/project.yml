name: FrameMacApp
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: local.vienson.frame-mac-app
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    PRODUCT_NAME: "Frame Mac App"
targets:
  FrameMacApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - ../FrameMacApp/Sources/FrameMacApp
      - ../fonts
      - FrameMacApp.xcassets
      - AppIcon.icns
    entitlements:
      path: FrameMacApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        SWIFT_EMIT_LOC_STRINGS: true
    postBuildScripts:
      - name: Copy AppIcon.icns
        script: |
          cp "${PROJECT_DIR}/AppIcon.icns" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
schemes:
  FrameMacApp:
    build:
      targets:
        FrameMacApp: all
    run:
      config: Debug
    archive:
      config: Release
